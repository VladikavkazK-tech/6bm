<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С днём рождения, мама!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
    <div class="container">
        <div class="constellations-container" id="constellationsContainer">
            <!-- Созвездия будут добавляться через JS -->
        </div>

        <footer class="creator-badge">
            Создано с любовью: твоя средняя дочь, Владислава.
        </footer>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="story-title"></h2>
            <img id="story-image" src="" alt="">
            <p id="story-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
